unbind r
bind r source-file ~/.tmux.conf

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off
set -g bell-action any

set -g prefix C-a
set -g mouse on
set -g renumber-windows on
set -g allow-rename on
set -g set-titles on
set -g detach-on-destroy off

setw -g aggressive-resize on
setw -g monitor-activity on
setw -g mode-keys vi

set -g base-index 1
set -g pane-base-index 1

set-option -g history-limit 5000

set -g default-terminal "${TERM}"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# Navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# change the path for newly created windows
bind c new-window -c "#{pane_current_path}"

# split window
unbind '"'
unbind %
bind C-v split-window -h -c "#{pane_current_path}"
bind C-h split-window -v -c "#{pane_current_path}"

# switch between windows
bind Space last-window
bind -r n next-window
bind -r p previous-window

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
run '~/.tmux/plugins/tpm/tpm'

# Tabbar ======
set -g status-position top
set -g status-style "bg=default,fg=default"
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bg=#ECBA70,fg=#000000] #I:#W #[bg=default,fg=default]"
set -g status-right "#[fg=#a6accd]#S "
set -g status-interval 1

# POPUPS ======

# open lazygit
bind y display-popup \
  -d "#{pane_current_path}" \
  -w 95% \
  -h 90% \
  -E "lazygit"

# open resource monitor
bind o display-popup \
  -w 80% \
  -h 80% \
  -E "TERM=xterm btop"

# create new session
bind C-n display-popup \
  -w 30 \
  -h 4 \
  -E 'bash -i -c "echo \"New Session \" && read name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

# fzf sessions
unbind s
bind s display-popup \
  -h 10 \
  -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
