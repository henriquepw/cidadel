host: citadel
description: Desktop

import: []

enabled_modules:
- cachyos-repo
- base
- dotfiles
- development
- gaming
- tailscale
- login-managers/ly-enable

packages: []
exclude: []
additional_packages: []

flatpak_scope: user
auto_prune: false
module_processing: parallel
strict_package_order: false

config_backups:
  enabled: true
  max_backups: 3

system_backups:
  enabled: true
  backup_on_sync: true
  backup_on_update: true
  tool: snapper
  snapper_config: root
  max_backups: 3

services:
  enabled:
  - NetworkManager
  - NetworkManager-dispatcher
  - NetworkManager-wait-online
  - ananicy-cpp
  - avahi-daemon
  - bluetooth
  - getty@
  - greetd
  - limine-snapper-sync
  - ufw
  disabled: []
  scope: system

enabled_service_profiles: []
update_hooks:
  pre_update: null
  post_update: null
  behavior: ask
  devel: false
  run_as_user: false

default_apps:
  scope: system
  browser: brave-browser
  text_editor: nvim
  file_manager: org.gnome.Nautilus
  terminal: ghostty
  video_player: null
  audio_player: null
  image_viewer: brave-browser
  pdf_viewer: brave-browser
  mime_types: {}

editor: nvim
aur_helper: paru
